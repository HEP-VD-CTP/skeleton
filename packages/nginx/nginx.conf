user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Backend load balancing — resolved at startup via Docker DNS
  # Docker returns all replica IPs for the service name
upstream backend {
  least_conn;
  server backend:9000;
  keepalive 64;
}

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /data/logs/nginx.access.log main;
  error_log /data/logs/nginx.error.log warn;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    listen [::]:80;
    server_name localhost; 

    return 301 https://$host$request_uri;
  }

  # HTTPS server block
  server {
    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;

    # enable http3
    http2 on;
    http3 on;
    quic_retry on;
    add_header Alt-Svc 'h3=":443"; ma=86400';  
    add_header X-Http3-Enabled "true";

    # hostname
    server_name localhost;

    # SSL certificate
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Enhance security with additional SSL settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # TLS 1.3 0-RTT for HTTP/3
    ssl_early_data on;

    # gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4; 
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml text/xml application/xhtml+xml;

    # caching and security
    server_tokens off;
    etag off;

    # proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # send query to frontend
    location / {
      proxy_pass http://frontend:8000;
    }

    # File uploads — large body, no buffering, long timeout
    location /api/files {
      proxy_pass http://backend;
      client_max_body_size 4G;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # API requests to backend
    location /api {
      proxy_pass http://backend;
      client_max_body_size 20M;
    }

    # Internal location for X-Accel-Redirect file serving
    location /internal-files/ {
      internal;
      alias /data/files/;
    }

  }

  # WebSocket server block for quasar dev mode
  server {
    listen 24678 ssl;
    listen [::]:24678 ssl;

    server_name localhost;
    
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Enhance security with additional SSL settings
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    location / {
      # Proxy to the Node.js application
      proxy_pass http://frontend:24678;

      # WebSocket-specific headers
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";

      # Preserve the original Host and IP information
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}